name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build · Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # pnpm/action-setup@v4 auto-detects the version from the
        # "packageManager" field in package.json (Corepack). Do NOT pass a
        # conflicting version input — doing so caused "Setup pnpm" to fail
        # on the first CI run.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          set +e
          pnpm lint 2>&1 | tee lint-output.log
          LINT_RC=${PIPESTATUS[0]}
          echo "lint_rc=$LINT_RC" >> "$GITHUB_OUTPUT"
          echo "::group::Lint full output"
          cat lint-output.log
          echo "::endgroup::"
          # Emit the first 25 lines as errors so they show in the GitHub UI
          head -25 lint-output.log | grep -E "error|Error|ERR|✖|warning" || true
          exit 0

      - name: Lint result
        run: |
          echo "Lint exited with: ${{ steps.lint.outputs.lint_rc }}"
          if [ "${{ steps.lint.outputs.lint_rc }}" != "0" ]; then
            # Emit each lint error line as a GitHub annotation so it is
            # readable via the check-runs annotations API.
            grep -E "error|Error|✖" lint-output.log | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & component tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Lighthouse audits run against the production bundle; the
          # WebSocket client gracefully no-ops when this is unset.
          NEXT_PUBLIC_WS_URL: ''
          NEXT_PUBLIC_API_URL: 'http://127.0.0.1:3210'

      - name: Lighthouse CI (autorun)
        run: pnpm lhci
        env:
          CI: true
          NEXT_PUBLIC_WS_URL: ''
          NEXT_PUBLIC_API_URL: 'http://127.0.0.1:3210'

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouse/ci
          retention-days: 14
          if-no-files-found: warn
